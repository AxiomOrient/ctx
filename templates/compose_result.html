<!-- 조합 결과 Fragment (HTMX로 로드됨) -->
<div class="space-y-4">
    <!-- Metadata -->
    <div class="bg-gray-50 rounded-lg p-4">
        <h4 class="text-sm font-medium text-gray-900 mb-2">조합 정보</h4>
        <div class="grid grid-cols-3 gap-4 text-sm">
            <div>
                <span class="text-gray-500">사용 토큰:</span>
                <span class="font-medium">{{ metadata.tokens_used }}</span>
            </div>
            <div>
                <span class="text-gray-500">선택 문서:</span>
                <span class="font-medium">{{ metadata.documents_selected }}</span>
            </div>
            <div>
                <span class="text-gray-500">선택 방법:</span>
                <span class="font-medium">{{ metadata.selection_method }}</span>
            </div>
        </div>
        {% if false %}
        <div class="mt-2 text-xs text-gray-500">
            추적 ID: {{ trace_id }}
        </div>
        {% endif %}
    </div>

    <!-- Prompt Preview -->
    <div>
        <div class="flex items-center justify-between mb-3">
            <h4 class="text-sm font-medium text-gray-900">생성된 프롬프트</h4>
            <button type="button" onclick="copyPrompt()"
                    class="text-sm text-blue-600 hover:text-blue-500 font-medium">
                복사
            </button>
        </div>
        
        <div class="bg-gray-900 rounded-lg p-4 overflow-auto max-h-96">
            <pre class="text-green-400 text-sm whitespace-pre-wrap font-mono">Sample prompt content here...</pre>
        </div>
    </div>

    <!-- Actions -->
    <div class="pt-4 border-t border-gray-200">
        <div class="flex space-x-3">
            <button type="button" onclick="copyPrompt()"
                    class="bg-gray-600 hover:bg-gray-700 text-white text-sm font-medium py-2 px-3 rounded-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500">
                프롬프트 복사
            </button>
            <button type="button" onclick="downloadPrompt()"
                    class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 px-3 rounded-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                파일로 저장
            </button>
        </div>
    </div>
</div>

<script>
const promptText = "Sample prompt content";

function copyPrompt() {
    navigator.clipboard.writeText(promptText).then(() => {
        showToast('프롬프트가 클립보드에 복사되었습니다.', 'success');
    }).catch(() => {
        showToast('복사에 실패했습니다.', 'error');
    });
}

function downloadPrompt() {
    const blob = new Blob([promptText], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'prompt.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('프롬프트가 다운로드되었습니다.', 'success');
}
</script>
