{% extends "base.html" %}
{% block title %}컨텍스트 목록{% endblock %}
{% block content %}
<h2 class="text-xl font-bold mb-4">컨텍스트 목록</h2>
<div class="overflow-auto">
  <table class="min-w-full text-sm">
    <thead>
      <tr><th class="p-2 text-left">문서 ID</th><th class="p-2 text-left">제목</th><th class="p-2 text-left">업로드 시각</th><th class="p-2 text-right">신뢰도</th></tr>
    </thead>
    <tbody>
      {% for d in documents %}
      <tr class="border-t">
        <td class="p-2 text-gray-600">{{ d.doc_id }}</td>
        <td class="p-2">
          <a onclick="navigateToContext('{{ d.doc_id }}')" class="text-blue-600 hover:underline cursor-pointer">{{ d.title }}</a>
        </td>
        <td class="p-2 text-gray-600">{{ d.uploaded_at }}</td>
        <td class="p-2 text-right">
          {{ d.confidence }}
          <button class="ml-3 text-red-600 hover:text-red-800 text-xs"
                  onclick="deleteDocument('{{ d.doc_id }}')">
            삭제
          </button>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<script>
function navigateToContext(docId) {
    const encodedId = encodeURIComponent(docId);
    htmx.ajax('GET', `/contexts/${encodedId}`, {target: '#main'});
    history.pushState(null, '', `/contexts/${encodedId}`);
}

function deleteDocument(docId) {
    if (!confirm('삭제하시겠습니까? 되돌릴 수 없습니다.')) return;
    
    const encodedId = encodeURIComponent(docId);
    fetch(`/v1/documents/${encodedId}`, {
        method: 'DELETE'
    })
    .then(response => {
        if (response.ok) {
            showToast('문서가 삭제되었습니다.', 'success');
            // 페이지 새로고침
            setTimeout(() => {
                htmx.ajax('GET', '/contexts', {target: '#main'});
            }, 1000);
        } else {
            showToast('삭제에 실패했습니다.', 'error');
        }
    })
    .catch(error => {
        console.error('Delete error:', error);
        showToast('삭제 중 오류가 발생했습니다.', 'error');
    });
}
</script>
{% endblock %}
