{% extends "base.html" %} {% block title %}프롬프트 조합 - Ctx{% endblock %} {%
block content %}
<div class="px-4 py-6 sm:px-0">
    <div class="border-4 border-dashed border-gray-200 rounded-lg p-6">
        <h2 class="text-2xl font-bold text-gray-900 mb-6">
            프롬프트 조합/빌더
        </h2>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Input Form -->
            <div class="bg-white shadow rounded-lg p-6">
                <div class="mb-4 border-b border-gray-200">
                    <nav class="-mb-px flex space-x-8">
                        <button
                            type="button"
                            onclick="showComposeTab('simple')"
                            id="simple-tab"
                            class="compose-tab active border-blue-500 text-blue-600 whitespace-nowrap py-2 px-1 border-b-2 font-medium text-sm"
                        >
                            초보자(조합)
                        </button>
                        <button
                            type="button"
                            onclick="showComposeTab('builder')"
                            id="builder-tab"
                            class="compose-tab border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-2 px-1 border-b-2 font-medium text-sm"
                        >
                            고급자(빌더)
                        </button>
                    </nav>
                </div>

                <form
                    hx-post="/compose"
                    hx-target="#compose-result"
                    hx-indicator="#compose-loading"
                    onsubmit="return prepareCompose(event)"
                >
                    <!-- 숨겨진 기본값들 -->
                    <input type="hidden" name="repo" value="local" />
                    <input type="hidden" name="branch" value="main" />
                    <input type="hidden" name="commit_sha" value="latest" />
                    <input
                        type="hidden"
                        name="facets"
                        id="facets-hidden"
                        value="{}"
                    />

                    <div id="compose-simple" class="space-y-4">
                        <!-- 간단한 패싯 선택 -->
                        <div>
                            <label
                                class="block text-sm font-medium text-gray-700 mb-3"
                                >기술 스택 선택</label
                            >
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm text-gray-600"
                                        >플랫폼</label
                                    >
                                    <select
                                        name="platform"
                                        id="platform"
                                        class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                    >
                                        <option value="">선택 안함</option>
                                        <option value="ios">iOS</option>
                                        <option value="android">Android</option>
                                        <option value="web">Web</option>
                                        <option value="server">Server</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm text-gray-600"
                                        >언어</label
                                    >
                                    <select
                                        name="language"
                                        id="language"
                                        class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                    >
                                        <option value="">선택 안함</option>
                                        <option value="swift">Swift</option>
                                        <option value="kotlin">Kotlin</option>
                                        <option value="typescript">
                                            TypeScript
                                        </option>
                                        <option value="rust">Rust</option>
                                        <option value="python">Python</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm text-gray-600"
                                    >프레임워크</label
                                >
                                <select
                                    name="framework"
                                    id="framework"
                                    class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                >
                                    <option value="">선택 안함</option>
                                    <option value="swiftui">SwiftUI</option>
                                    <option value="uikit">UIKit</option>
                                    <option value="compose">
                                        Jetpack Compose
                                    </option>
                                    <option value="react">React</option>
                                    <option value="svelte">Svelte</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm text-gray-600"
                                    >작업 유형</label
                                >
                                <select
                                    name="action"
                                    id="action"
                                    class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                >
                                    <option value="">선택 안함</option>
                                    <option value="develop">개발</option>
                                    <option value="design">설계</option>
                                    <option value="test">테스트</option>
                                    <option value="debug">디버깅</option>
                                    <option value="refactor">리팩토링</option>
                                </select>
                            </div>
                        </div>

                        <!-- 키워드 검색 -->
                        <div>
                            <label
                                for="query_text"
                                class="block text-sm font-medium text-gray-700"
                                >키워드 검색 (선택)</label
                            >
                            <input
                                type="text"
                                name="query_text"
                                id="query_text"
                                class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                placeholder="예: 로그인, 네트워킹, 애니메이션"
                            />
                        </div>

                        <!-- 고급 설정 (접을 수 있음) -->
                        <details class="border border-gray-200 rounded-md p-3">
                            <summary
                                class="cursor-pointer text-sm font-medium text-gray-700"
                            >
                                고급 설정
                            </summary>
                            <div class="mt-3 space-y-3">
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label
                                            for="budget"
                                            class="block text-sm text-gray-600"
                                            >토큰 예산</label
                                        >
                                        <input
                                            type="number"
                                            name="budget"
                                            id="budget"
                                            value="2000"
                                            class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                        />
                                    </div>
                                    <div>
                                        <label
                                            for="confidence_threshold"
                                            class="block text-sm text-gray-600"
                                            >신뢰도 임계값</label
                                        >
                                        <input
                                            type="number"
                                            name="confidence_threshold"
                                            id="confidence_threshold"
                                            step="0.1"
                                            min="0"
                                            max="1"
                                            value="0.65"
                                            class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                        />
                                    </div>
                                </div>
                            </div>
                        </details>

                        <div class="flex items-center justify-between">
                            <button
                                type="submit"
                                class="bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500"
                            >
                                프롬프트 조합
                            </button>

                            <div id="compose-loading" class="htmx-indicator">
                                <div class="flex items-center text-gray-500">
                                    <svg
                                        class="animate-spin -ml-1 mr-3 h-5 w-5 text-gray-500"
                                        xmlns="http://www.w3.org/2000/svg"
                                        fill="none"
                                        viewBox="0 0 24 24"
                                    >
                                        <circle
                                            class="opacity-25"
                                            cx="12"
                                            cy="12"
                                            r="10"
                                            stroke="currentColor"
                                            stroke-width="4"
                                        ></circle>
                                        <path
                                            class="opacity-75"
                                            fill="currentColor"
                                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                                        ></path>
                                    </svg>
                                    조합 중...
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="compose-builder" class="hidden">
                        <label
                            class="block text-sm font-medium text-gray-700 mb-2"
                            >패싯 JSON (예:
                            {"language":["rust"],"platform":["server"]})</label
                        >
                        <textarea
                            id="facets-builder"
                            rows="8"
                            class="w-full border rounded p-2 font-mono text-sm"
                            placeholder='{"language":["rust"]}'
                        ></textarea>
                    </div>
                </form>
            </div>

            <!-- Results -->
            <div class="bg-white shadow rounded-lg p-6">
                <h3 class="text-lg font-medium text-gray-900 mb-4">
                    조합 결과
                </h3>

                <div id="compose-result">
                    <div class="text-center py-8 text-gray-500">
                        <svg
                            class="mx-auto h-12 w-12 text-gray-400"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                            />
                        </svg>
                        <p class="mt-2">설정을 입력하고 조합을 실행하세요.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 패싯 JSON 유효성 검사
    document.getElementById("facets").addEventListener("blur", function () {
        try {
            JSON.parse(this.value);
            this.classList.remove("border-red-300");
            this.classList.add("border-gray-300");
        } catch (e) {
            this.classList.remove("border-gray-300");
            this.classList.add("border-red-300");
        }
    });
    function showComposeTab(tab) {
        document.querySelectorAll(".compose-tab").forEach((btn) => {
            btn.classList.remove("active", "border-blue-500", "text-blue-600");
            btn.classList.add("border-transparent", "text-gray-500");
        });
        document
            .getElementById(tab + "-tab")
            .classList.add("active", "border-blue-500", "text-blue-600");
        document
            .getElementById(tab + "-tab")
            .classList.remove("border-transparent", "text-gray-500");
        document
            .getElementById("compose-simple")
            .classList.toggle("hidden", tab !== "simple");
        document
            .getElementById("compose-builder")
            .classList.toggle("hidden", tab !== "builder");
    }

    function prepareCompose(e) {
        const isBuilder =
            document
                .getElementById("compose-builder")
                .classList.contains("hidden") === false;
        const hidden = document.getElementById("facets-hidden");
        if (isBuilder) {
            const raw = document.getElementById("facets-builder").value || "{}";
            try {
                JSON.parse(raw);
                hidden.value = raw;
            } catch (err) {
                alert("패싯 JSON이 올바르지 않습니다.");
                e.preventDefault();
                return false;
            }
        } else {
            const map = {};
            const pushVal = (ns, v) => {
                if (!v) return;
                if (!map[ns]) map[ns] = [];
                map[ns].push(v);
            };
            pushVal("platform", document.getElementById("platform").value);
            pushVal("language", document.getElementById("language").value);
            pushVal("framework", document.getElementById("framework").value);
            pushVal("action", document.getElementById("action").value);
            hidden.value = JSON.stringify(map);
        }
        return true;
    }
</script>
{% endblock %}
