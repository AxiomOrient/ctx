# rules.yaml — production-grade rules for product/design/engineering across web/iOS/Android/server
# 가중치 정책(가이드):
# - lang/codefence: 1.0~1.2
# - framework/platform: 0.8~1.2
# - action/phase: 0.5~0.9
# - build/runtime: 0.8~1.0
# - methodology/arch: 0.7~1.0
# 상황에 맞게 미세 조정하면 됨.

################################################################################
# 1) 정규식 기반 탐지 (문맥 강한 신호)
################################################################################
regex_rules:
  - { ns: "discipline", value: "product", pattern: "(?i)prd|요구사항|기획|requirement(s)?", weight: 1.0 }
  - { ns: "discipline", value: "design", pattern: "(?i)wireframe|prototype|mockup|디자인|ux|ui", weight: 1.0 }
  - { ns: "discipline", value: "engineering", pattern: "(?i)레포지토리|빌드|코드|엔지니어링|engineering", weight: 1.0 }
  - { ns: "framework", value: "swiftui", pattern: "\\bSwiftUI\\b", weight: 1.2 }
  - { ns: "framework", value: "uikit",   pattern: "\\bUIKit\\b",  weight: 1.0 }
  - { ns: "framework", value: "compose", pattern: "\\bJetpack\\s*Compose\\b", weight: 1.1 }
  - { ns: "framework", value: "react",   pattern: "\\bReact(\\.js|JS)?\\b|\\bNext\\.js\\b|\\bNextjs\\b", weight: 1.1 }
  - { ns: "framework", value: "svelte",  pattern: "\\bSvelte(Kit)?\\b", weight: 1.0 }
  - { ns: "arch", value: "mvvm", pattern: "\\bMVVM\\b", weight: 0.9 }
  - { ns: "arch", value: "mvi", pattern: "\\bMVI\\b", weight: 0.9 }
  - { ns: "arch", value: "clean", pattern: "(?i)clean\\s+architecture", weight: 0.9 }
  - { ns: "arch", value: "hexagonal", pattern: "(?i)hexagonal\\s+architecture|ports\\s*and\\s*adapters", weight: 0.9 }
  - { ns: "action", value: "plan", pattern: "(?i)계획|plan(ning)?|요구사항|breakdown", weight: 0.8 }
  - { ns: "action", value: "design", pattern: "(?i)설계|spec(ification)?|architecture", weight: 0.9 }
  - { ns: "action", value: "implement", pattern: "(?i)구현|개발|implement(ation)?|code|coding", weight: 0.9 }
  - { ns: "action", value: "test", pattern: "(?i)테스트|qa|test(ing)?|assert", weight: 0.9 }
  - { ns: "action", value: "debug", pattern: "(?i)디버그|디버깅|debug(ging)?|trace", weight: 1.0 }
  - { ns: "action", value: "review", pattern: "(?i)리뷰|review|code\\s*review", weight: 0.8 }
  - { ns: "action", value: "deploy", pattern: "(?i)배포|releas(e|ing)|deploy(ment)?", weight: 0.8 }
  - { ns: "phase", value: "discovery", pattern: "(?i)discovery|리서치|요구사항", weight: 0.9 }
  - { ns: "phase", value: "design", pattern: "(?i)설계|spec", weight: 0.9 }
  - { ns: "phase", value: "implementation", pattern: "(?i)구현|coding|코딩", weight: 0.9 }
  - { ns: "phase", value: "testing", pattern: "(?i)테스트|검증|qa", weight: 0.9 }
  - { ns: "phase", value: "release", pattern: "(?i)배포|release|출시", weight: 0.9 }
  - { ns: "platform", value: "ios", pattern: "\\biOS\\b|\\biPhone\\b|\\bXcode\\b", weight: 1.0 }
  - { ns: "platform", value: "android", pattern: "\\bAndroid\\b|\\bGradle\\b|\\bAOSP\\b", weight: 1.0 }
  - { ns: "platform", value: "web", pattern: "\\bDOM\\b|\\bSPA\\b|\\bbrowser\\b|\\bNext\\.js\\b", weight: 0.9 }
  - { ns: "platform", value: "server", pattern: "\\bbackend\\b|\\bserver\\b|\\bAPI\\s*서버\\b", weight: 0.9 }
  - { ns: "runtime", value: "nodejs", pattern: "\\bNode(\\.js)?\\b", weight: 1.0 }
  - { ns: "runtime", value: "tokio", pattern: "\\bTokio\\b", weight: 0.9 }
  - { ns: "runtime", value: "jvm", pattern: "\\bJVM\\b|\\bJava\\s*VM\\b", weight: 0.9 }
  - { ns: "build", value: "xcodebuild", pattern: "\\bxcodebuild\\b", weight: 1.0 }
  - { ns: "build", value: "gradle", pattern: "\\bgradle\\b|\\b\\.gradle\\b|\\bsettings\\.gradle\\b", weight: 1.0 }
  - { ns: "build", value: "cargo", pattern: "\\bcargo\\s+(build|test|clippy|fmt|audit)\\b", weight: 1.0 }
  - { ns: "build", value: "vite", pattern: "\\bvite\\b|\\bnpm\\s+run\\s+dev\\b|\\bpnpm\\s+dev\\b", weight: 0.9 }
  - { ns: "lang", value: "swift", pattern: "\\bSwift\\b|\\bswift\\s+build\\b", weight: 1.0 }
  - { ns: "lang", value: "kotlin", pattern: "\\bKotlin\\b", weight: 1.0 }
  - { ns: "lang", value: "typescript", pattern: "\\bTypeScript\\b|\\bTSX?\\b", weight: 1.0 }
  - { ns: "lang", value: "javascript", pattern: "\\bJavaScript\\b|\\bJS\\b", weight: 1.0 }
  - { ns: "lang", value: "rust", pattern: "\\bRust\\b|\\brustc\\b", weight: 1.0 }
  - { ns: "lang", value: "python", pattern: "\\bPython\\b|\\buv\\b|\\bpip\\b", weight: 0.9 }
  - { ns: "target", value: "ios17", pattern: "\\biOS\\s*17\\b|\\bios\\s*>=\\s*17\\b", weight: 0.9 }
  - { ns: "target", value: "android14", pattern: "\\b(API\\s*34|Android\\s*14)\\b", weight: 0.9 }
  - { ns: "target", value: "node20", pattern: "\\bNode\\s*(v)?20\\b|\\bnode\\s*>=\\s*20\\b", weight: 0.9 }
  - { ns: "ai", value: "prompt-engineering", pattern: "(?i)prompt(\\s+engineering|\\s*디자인)?", weight: 1.0 }
  - { ns: "ai", value: "rag", pattern: "(?i)retrieval\\s+augmented\\s+generation|\\brag\\b", weight: 1.0 }
  - { ns: "ai", value: "embedding", pattern: "(?i)embedding|vector\\s+embedding|vector\\s+db", weight: 0.9 }
  - { ns: "infra", value: "terraform", pattern: "(?i)terraform|iac|tf", weight: 1.0 }
  - { ns: "infra", value: "serverless", pattern: "(?i)serverless|lambda|cloud\\s+functions", weight: 0.9 }
  - { ns: "infra", value: "kubernetes", pattern: "(?i)kubernetes|k8s", weight: 0.9 }
  - { ns: "security", value: "iam", pattern: "(?i)iam|least\\s+privilege", weight: 0.9 }
  - { ns: "security", value: "secrets", pattern: "(?i)secret(s)?|credentials|api\\s*key(s)?", weight: 0.9 }
  - { ns: "security", value: "timeout-mismatch", pattern: "(?i)timeout(s)?\\s+(cascade|mismatch)", weight: 0.9 }
  - { ns: "artifact", value: "prd", pattern: "(?i)prd|요구사항\\s*정의서", weight: 1.1 }
  - { ns: "artifact", value: "requirement-spec", pattern: "(?i)requirement(s)?\\s*(spec|doc)", weight: 1.0 }
  - { ns: "artifact", value: "design-spec", pattern: "(?i)design\\s*spec|ui\\s*spec|ux\\s*spec|설계서", weight: 1.0 }
  - { ns: "artifact", value: "api-spec-openapi", pattern: "(?i)openapi|swagger", weight: 1.1 }
  - { ns: "artifact", value: "architecture-diagram", pattern: "(?i)mermaid|diagram|draw\\.io", weight: 1.0 }
  - { ns: "artifact", value: "db-schema", pattern: "(?i)erd|schema", weight: 0.9 }
  - { ns: "artifact", value: "test-plan", pattern: "(?i)test\\s*plan|qa\\s*plan", weight: 0.9 }
  - { ns: "artifact", value: "test-case", pattern: "(?i)test\\s*case|tc", weight: 0.9 }
  - { ns: "artifact", value: "runbook", pattern: "(?i)runbook|disaster\\s*recovery", weight: 0.9 }
  - { ns: "artifact", value: "checklist", pattern: "(?i)checklist", weight: 0.9 }
  - { ns: "artifact", value: "review-report", pattern: "(?i)code\\s*review|review\\s*report", weight: 0.9 }
  - { ns: "artifact", value: "proto-idl", pattern: "(?i)idl|protobuf|thrift", weight: 0.9 }
  - { ns: "artifact", value: "sdk", pattern: "(?i)client\\s*library|sdk", weight: 0.9 }
  - { ns: "artifact", value: "postman-collection", pattern: "(?i)postman|insomnia", weight: 0.9 }
  - { ns: "artifact", value: "release-notes", pattern: "(?i)release\\s*notes|changelog", weight: 0.8 }
  - { ns: "artifact", value: "task-ticket", pattern: "(?i)issue|ticket", weight: 0.8 }

################################################################################
# 2) 키워드 기반 (약한 신호 보강)
################################################################################
keyword_rules:
  - { ns: "discipline", value: "product", keywords: ["prd","요구사항","기획","requirement"], weight: 0.9 }
  - { ns: "discipline", value: "design", keywords: ["wireframe","prototype","디자인","ux","ui"], weight: 0.9 }
  - { ns: "discipline", value: "engineering", keywords: ["개발","엔지니어링","레포지토리","빌드"], weight: 0.9 }
  - { ns: "tier", value: "frontend", keywords: ["front-end","frontend","fe"], weight: 0.7 }
  - { ns: "tier", value: "backend", keywords: ["back-end","backend","be","server"], weight: 0.7 }
  - { ns: "tier", value: "mobile", keywords: ["mobile","ios","android"], weight: 0.7 }
  - { ns: "platform", value: "ios", keywords: ["ios","iphone","xcode","swiftui","uikit"], weight: 0.8 }
  - { ns: "platform", value: "android", keywords: ["android","gradle","compose"], weight: 0.8 }
  - { ns: "platform", value: "web", keywords: ["web","browser","dom","react","svelte"], weight: 0.7 }
  - { ns: "platform", value: "server", keywords: ["server","backend","api","rest"], weight: 0.7 }
  - { ns: "lang", value: "swift", keywords: ["swift"], weight: 1.0 }
  - { ns: "lang", value: "kotlin", keywords: ["kotlin"], weight: 1.0 }
  - { ns: "lang", value: "typescript", keywords: ["typescript","ts","tsx"], weight: 1.0 }
  - { ns: "lang", value: "javascript", keywords: ["javascript","js"], weight: 1.0 }
  - { ns: "lang", value: "rust", keywords: ["rust","cargo"], weight: 1.0 }
  - { ns: "lang", value: "python", keywords: ["python","pip","uv"], weight: 0.9 }
  - { ns: "artifact", value: "prd", keywords: ["prd","요구사항 정의서"], weight: 0.9 }
  - { ns: "artifact", value: "requirement-spec", keywords: ["requirements"], weight: 0.8 }
  - { ns: "artifact", value: "design-spec", keywords: ["design spec","ui spec","ux spec","설계서"], weight: 0.8 }
  - { ns: "artifact", value: "api-spec-openapi", keywords: ["openapi","swagger"], weight: 0.9 }
  - { ns: "artifact", value: "architecture-diagram", keywords: ["mermaid","diagram","draw.io"], weight: 0.8 }
  - { ns: "artifact", value: "db-schema", keywords: ["db schema","erd"], weight: 0.8 }
  - { ns: "artifact", value: "test-plan", keywords: ["test plan","qa plan"], weight: 0.7 }
  - { ns: "artifact", value: "test-case", keywords: ["test case","tc"], weight: 0.7 }
  - { ns: "artifact", value: "runbook", keywords: ["runbook"], weight: 0.7 }
  - { ns: "artifact", value: "checklist", keywords: ["checklist"], weight: 0.7 }
  - { ns: "artifact", value: "review-report", keywords: ["code review","review report"], weight: 0.7 }
  - { ns: "artifact", value: "proto-idl", keywords: ["idl","protobuf","thrift"], weight: 0.7 }
  - { ns: "artifact", value: "sdk", keywords: ["sdk","client library"], weight: 0.7 }
  - { ns: "artifact", value: "postman-collection", keywords: ["postman","insomnia"], weight: 0.7 }
  - { ns: "artifact", value: "release-notes", keywords: ["release notes","changelog"], weight: 0.6 }
  - { ns: "artifact", value: "task-ticket", keywords: ["issue","ticket"], weight: 0.6 }

################################################################################
# 3) 링크 기반 (공식 문서/디자인 가이드 도메인 시 강한 힌트)
################################################################################
link_rules:
  - { ns: "platform", value: "ios", host_contains: ["developer.apple.com"], weight: 0.8 }
  - { ns: "discipline", value: "design", host_contains: ["developer.apple.com/design"], weight: 0.7 }
  - { ns: "platform", value: "android", host_contains: ["developer.android.com"], weight: 0.8 }
  - { ns: "discipline", value: "design", host_contains: ["material.io","m3.material.io"], weight: 0.7 }
  - { ns: "platform", value: "web", host_contains: ["react.dev","nextjs.org","typescriptlang.org","mdn.mozilla.org"], weight: 0.7 }
  - { ns: "platform", value: "server", host_contains: ["rust-lang.org","tokio.rs","docs.rs"], weight: 0.7 }
  - { ns: "lang", value: "rust", host_contains: ["rust-lang.org","docs.rs"], weight: 0.8 }
  - { ns: "artifact", value: "api-spec-openapi", host_contains: ["swagger.io","spec.openapis.org","github.com/OAI"], weight: 0.8 }
  - { ns: "artifact", value: "postman-collection", host_contains: ["postman.com","insomnia.rest"], weight: 0.8 }
  - { ns: "ai", value: "rag", host_contains: ["arxiv.org","huggingface.co"], weight: 0.7 }
  - { ns: "infra", value: "terraform", host_contains: ["developer.hashicorp.com","registry.terraform.io"], weight: 0.7 }
  - { ns: "discipline", value: "design", host_contains: ["figma.com"], weight: 0.6 }

################################################################################
# 4) 코드펜스 언어 기반 (가장 신뢰도 높음)
################################################################################
codefence_rules:
  - { ns: "lang", value: "swift", languages: ["swift"], weight: 1.2 }
  - { ns: "lang", value: "kotlin", languages: ["kotlin"], weight: 1.2 }
  - { ns: "lang", value: "typescript", languages: ["ts","tsx","typescript"], weight: 1.2 }
  - { ns: "lang", value: "javascript", languages: ["js","javascript"], weight: 1.2 }
  - { ns: "lang", value: "rust", languages: ["rust"], weight: 1.2 }
  - { ns: "lang", value: "python", languages: ["py","python"], weight: 1.1 }
  - { ns: "lang", value: "sql", languages: ["sql"], weight: 1.1 }
  - { ns: "artifact", value: "architecture-diagram", languages: ["mermaid"], weight: 1.1 }
  - { ns: "artifact", value: "api-spec-openapi", languages: ["openapi","yaml","json"], weight: 1.2 }
  - { ns: "build", value: "xcodebuild", languages: ["xcodebuild"], weight: 1.1 }
  - { ns: "build", value: "gradle", languages: ["gradle","kts"], weight: 1.1 }
  - { ns: "build", value: "cargo", languages: ["cargo","toml"], weight: 1.1 }
  - { ns: "build", value: "vite", languages: ["vite"], weight: 1.0 }
  - { ns: "infra", value: "terraform", languages: ["hcl","terraform"], weight: 1.1 }
  - { ns: "runtime", value: "nodejs", languages: ["node","nodejs","json"], weight: 1.0 }

################################################################################
# 5) 규칙 연계 (암시적 태그 보강)
################################################################################
implies_rules:
  - { when: { framework: swiftui }, then: [ { platform: ios }, { lang: swift }, { tier: mobile } ] }
  - { when: { framework: compose }, then: [ { platform: android }, { lang: kotlin }, { tier: mobile } ] }
  - { when: { framework: react }, then: [ { platform: web }, { lang: typescript }, { tier: frontend } ] }
  - { when: { tier: frontend }, then: [ { platform: web } ] }
  - { when: { tier: backend }, then: [ { platform: server } ] }
  - { when: { artifact: api-spec-openapi }, then: [ { role: api-documenter }, { doc_process: versioning } ] }
  - { when: { ai: rag }, then: [ { ai: embedding }, { data_store: vector-db } ] }
  - { when: { role: cloud-architect }, then: [ { infra: terraform }, { infra: kubernetes } ] }
  - { when: { role: backend-architect }, then: [ { data_store: relational }, { security: iam } ] }
