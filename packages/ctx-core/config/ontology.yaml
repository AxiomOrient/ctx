rules:
  implies:
    - when: { framework: swiftui }
      then: [ { platform: ios }, { lang: swift }, { tier: mobile } ]
    - when: { framework: uikit }
      then: [ { platform: ios }, { lang: swift }, { tier: mobile } ]
    - when: { framework: compose }
      then: [ { platform: android }, { lang: kotlin }, { tier: mobile } ]
    - when: { framework: react }
      then: [ { platform: web }, { lang: typescript }, { tier: frontend } ]
    - when: { tier: frontend }
      then: [ { platform: web } ]
    - when: { tier: backend }
      then: [ { platform: server } ]
    - when: { discipline: product }
      then: [ { phase: discovery } ]
    - when: { action: plan }
      then: [ { phase: discovery } ]
    - when: { action: design }
      then: [ { phase: design } ]
    - when: { action: implement }
      then: [ { phase: implementation } ]
    - when: { action: test }
      then: [ { phase: testing } ]
    - when: { action: deploy }
      then: [ { phase: release } ]
    - when: { role: api-documenter }
      then: [ { artifact: api-spec-openapi }, { doc_process: versioning } ]
    - when: { role: backend-architect }
      then: [ { data_store: relational }, { data_store: indexing }, { security: iam } ]
    - when: { role: cloud-architect }
      then: [ { infra: terraform }, { infra: kubernetes }, { infra: serverless } ]
    - when: { role: ai-engineer }
      then: [ { ai: llm-integration }, { ai: prompt-engineering }, { data_store: vector-db } ]
  conflicts:
    - sets: [ { ui: hig }, { ui: material } ]