meta:
  version: "2025-08-20-studio+workflow"
  layer_order:
    - discipline
    - role
    - action
    - phase
    - tier
    - platform
    - lang
    - framework
    - library
    - data_store
    - ai
    - arch
    - runtime
    - build
    - infra
    - security
    - version
    - target
    - artifact
    - doc_process
  namespace_policies:
    discipline: { multi: true }
    role: { multi: true }
    action: { multi: true }
    phase: { multi: true, ordered: true }
    tier: { multi: true }
    platform: { multi: true }
    lang: { multi: true }
    framework: { multi: true }
    library: { multi: true }
    data_store: { multi: true }
    ai: { multi: true }
    arch: { multi: true }
    runtime: { multi: true }
    build: { multi: true }
    infra: { multi: true }
    security: { multi: true }
    version: { multi: true }
    target: { multi: true }
    artifact: { multi: true }
    doc_process: { multi: true }
