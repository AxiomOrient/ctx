{% extends "base.html" %}
{% block title %}DB Query{% endblock %}
{% block content %}
<h2 class="text-xl font-bold mb-4">Read-only SQL Query</h2>
<form hx-post="/db/query" hx-target="#qres" hx-indicator="#loading">
  <textarea name="sql" rows="8" class="w-full border rounded p-2 font-mono text-sm" placeholder="SELECT name FROM sqlite_master WHERE type='table'"></textarea>
  <div class="mt-2 flex gap-2 items-center">
    <input type="number" name="limit" value="200" class="border rounded p-1 w-24"/>
    <button class="px-3 py-1 bg-blue-600 text-white rounded">Run</button>
    <span id="loading" class="htmx-indicator text-gray-500">Running…</span>
  </div>
</form>
<div id="qres" class="mt-4 text-sm text-gray-800"></div>
{% endblock %}
