[workspace]
resolver = "2"
members = [
    "packages/ctx-core",
    "packages/ctx-cli",
]

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1"
regex = "1.10"
once_cell = "1.19"
lazy_static = "1.4"
sha2 = "0.10"
uuid = { version = "1.8", features = ["v5", "serde"] }
toml = "0.8"
ahash = "0.8.11"
lru = "0.12.3"
tempfile = "3.10.1"

# Async
tokio = { version = "1", features = ["full"] }

# Database
rusqlite = { version = "0.29.0", features = ["bundled", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = "0.22"

# Tracing & Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive", "color"] }
colored = "2.1"

# Server
axum = "0.7"
axum-extra = { version = "0.9", features = ["form"] }
tower-http = { version = "0.5.2", features = ["cors", "trace", "limit"] }
askama = { version = "0.14.0", features = ["serde_json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
