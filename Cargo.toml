[package]
name = "ctx"
version = "0.2.0"
edition = "2024"
publish = false
authors = ["Axient Inc"]
description = "Deterministic evidence graph for small local ontologies and topologies"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { package = "yaml_serde", version = "0.10" }
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
