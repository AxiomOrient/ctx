[package]
name = "ctx"
version = "0.1.0"
edition = "2021"

[features]
default = ["mcp"]
http = ["axum", "axum-extra", "tokio-stream", "tower-http", "askama"]
api = ["reqwest"]
embeddings = ["tokenizers"] # Using tokenizers as a proxy for embeddings feature
mcp = []
db_write = []

[dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
regex = "1.10"
lazy_static = "1.4"
uuid = { version = "1.8", features = ["v5", "serde"] }
toml = "0.8"
ahash = "0.8.11"
lru = "0.12.3"
tempfile = "3.10.1"
async-trait = "0.1"
time = { version = "0.3", features = ["macros","parsing","formatting"] }

# Async & I/O
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", optional = true }


# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "macros", "uuid"] }
once_cell = "1.19"

# Tracing & Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive", "color"] }
colored = "2.1"

# HTTP Server (optional)
axum = { version = "0.7", optional = true }
axum-extra = { version = "0.9", features = ["form"], optional = true }
tower-http = { version = "0.5.2", features = ["cors", "trace", "limit"], optional = true }
askama = { version = "0.14.0", features = ["serde_json"], optional = true }

# API Client (optional)
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate"], optional = true }

# Token counting (optional)
tokenizers = { version = "0.19", default-features = false, features=["onig"], optional = true }
chrono = "0.4.41"
sha2 = "0.10.9"


[profile.release]
lto = true
codegen-units = 1
strip = true
